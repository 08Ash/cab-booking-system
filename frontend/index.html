<!DOCTYPE html>
<html>
<head>
<title>Cab Booking System</title>

<style>
body{
font-family: Arial;
background:#f4f6f9;
text-align:center;
}

.container{
margin-top:80px;
}

h1{
font-size:40px;
margin-bottom:40px;
}

.panel{
display:inline-block;
width:200px;
padding:30px;
margin:20px;
background:white;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

button{
width:150px;
padding:10px;
margin-top:15px;
border:none;
background:#007bff;
color:white;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

a{
text-decoration:none;
}
</style>

</head>

<body>

<div class="container">

<h1>🚖 Cab Booking System</h1>

<div class="panel">
<h3>Rider Panel</h3>
<a href="rider.html">
<button>Open Rider</button>
</a>
</div>

<div class="panel">
<h3>Driver Panel</h3>
<a href="driver.html">
<button>Open Driver</button>
</a>
</div>

</div>

</body>
</html>
